<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable cropping -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Centered within 80% safe zone -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Golden Ring -->
    <circle cx="256" cy="230" r="140" fill="#292524" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Embellished Biryani Pot / Flame & Crossed Utensils -->
    <g transform="translate(156, 120)">
      <circle cx="100" cy="95" r="75" fill="#f59e0b" opacity="0.15"/>
      <path d="M45,40 L155,165" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
      <path d="M155,40 L45,165" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
      <ellipse cx="100" cy="115" rx="55" ry="32" fill="url(#emeraldGrad)"/>
      <path d="M60,115 C60,75 140,75 140,115 Z" fill="url(#goldGrad)"/>
      <circle cx="100" cy="72" r="8" fill="#fef3c7"/>
      <path d="M75,130 Q100,140 125,130" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>

    <text x="256" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">
      M.M.A.
    </text>
    <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#fbbf24" letter-spacing="3">
      KABABS &amp; BIRYANI
    </text>
  </g>
</svg>
